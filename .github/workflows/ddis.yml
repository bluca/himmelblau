name: Build and publish signed DDIs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        default: nightly
        type: choice
        options: [stable, nightly]
      tag:
        description: Existing stable tag (leave empty for nightly)
        type: string
      revision:
        description: Optional stable source revision (nightlies always use main)
        type: string
      distro:
        description: Supported distro, including arch or gentoo, or all
        default: all
        type: string
      architecture:
        description: Supported architecture
        default: all
        type: choice
        options: [all, amd64, arm64]
      refresh_build_container:
        description: Refresh build-container dependencies
        default: false
        type: boolean
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      tag:
        type: string
        default: ''
      revision:
        type: string
        default: ''
      tooling_sha:
        type: string
        required: true
      distro:
        type: string
        default: all
      architecture:
        type: string
        default: all
      refresh_build_container:
        type: boolean
        default: false
    secrets:
      CLOUDSMITH_PACKAGE_PUBLISHER:
        required: true
      PACKAGE_SIGNING_KEY:
        required: true
      PACKAGE_SIGNING_PASSPHRASE:
        required: false
      SCC_EMAIL:
        required: false
      SCC_REGCODE:
        required: false

permissions:
  contents: read

concurrency:
  group: ddis-${{ inputs.channel || 'nightly' }}-${{ inputs.tag || 'main' }}-${{ inputs.distro || 'all' }}-${{ inputs.architecture || 'all' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'himmelblau-idm/himmelblau' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      tooling_sha: ${{ steps.prepare.outputs.tooling_sha }}
    steps:
      - name: Checkout trusted release tooling and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tooling_sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate sources and select every supported DDI target
        id: prepare
        env:
          DDI_CHANNEL: ${{ inputs.channel || 'nightly' }}
          RELEASE_TAG: ${{ inputs.tag }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_DISTRO: ${{ inputs.distro }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: python3 .github/scripts/ddi.py prepare

  images:
    name: ${{ fromJSON(matrix.spec).distro }} ${{ fromJSON(matrix.spec).architecture }}
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/ddi-target.yml
    with:
      spec: ${{ matrix.spec }}
      tooling_sha: ${{ needs.prepare.outputs.tooling_sha }}
      refresh_build_container: ${{ inputs.refresh_build_container || false }}
    secrets:
      CLOUDSMITH_PACKAGE_PUBLISHER: ${{ secrets.CLOUDSMITH_PACKAGE_PUBLISHER }}
      PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
      PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
      SCC_EMAIL: ${{ secrets.SCC_EMAIL }}
      SCC_REGCODE: ${{ secrets.SCC_REGCODE }}
